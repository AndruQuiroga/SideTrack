[project]
name = "sidetrack-audio-lab"
version = "0.1.0"
description = "Audio model benchmark for Sidetrack (ADR 0004). A CLI; it serves nothing."
requires-python = ">=3.11,<3.12"
# Core layer: manifests, decoding, runs, neighbours, report. No PyTorch, so CI can test it.
dependencies = [
    "numpy==2.3.5",
    "pyarrow==26.0.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
]

[project.optional-dependencies]
# Real model adapters. torch/torchaudio come from the CUDA 12.8 index: the first builds
# with Blackwell (RTX 5070, sm_120) and without Pascal (GTX 1070 Ti; a later change).
# torchaudio 2.11 is its last release and pins torch 2.11. transformers stays on 4.x
# because MERT loads remote code written against it.
models = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==4.57.6",
    "muq==0.1.0",
]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[project.scripts]
audio-lab = "audio_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_lab"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not gpu'"
markers = ["gpu: needs a CUDA GPU, the models extra and downloaded weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
