<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Lab Duels</title>
<!-- Generated by `audio-lab report`. Self-contained: no network requests. Audio plays from local files. -->
<style>
:root {
  --bg: #f4f5f7; --surface: #fff; --surface-2: #eceef2; --fg: #14171f; --muted: #5d6676;
  --line: #d3d8e0; --accent: #3557e0; --accent-fg: #fff; --tie: #a87905;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface-2: #212734; --fg: #e5e9f1; --muted: #98a1b2;
    --line: #2f3747; --accent: #8199ff; --accent-fg: #0f1218; --tie: #e8b23a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { margin: 0; font-size: 1.1rem; }
.meta { color: var(--muted); font-size: .8rem; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button, .btn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
kbd { font: 600 .75rem ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--fg); }
main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
[hidden] { display: none !important; }
.progress { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .85rem; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.track { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.track small { display: block; font-weight: 400; color: var(--muted); font-size: .9rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
.play { justify-self: start; }
.choices { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.choices button { padding: 12px; font-weight: 600; }
.choices .tie { border-color: var(--tie); }
.minor { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; color: var(--muted); font-size: .85rem; align-items: center; }
.done-msg { text-align: center; padding: 24px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { font-size: .8rem; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.table-wrap { overflow-x: auto; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
.browse { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; }
@media (max-width: 760px) { .browse { grid-template-columns: 1fr; } .seedlist { max-height: 30vh; } }
.seedlist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-y: auto; max-height: 75vh; }
.seedlist input { width: calc(100% - 16px); margin: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
.seedlist button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; padding: 7px 10px; cursor: pointer; font: inherit; font-size: .85rem; }
.seedlist button[aria-current="true"] { background: var(--surface-2); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cols ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .85rem; }
.cols li button { border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 0; }
.cols li button:hover { color: var(--accent); }
.sim { color: var(--muted); font-size: .75rem; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Audio lab</h1>
  <span class="meta" id="meta"></span>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="duels" aria-selected="true">Duels</button>
    <button type="button" role="tab" data-tab="results" aria-selected="false">Results</button>
    <button type="button" role="tab" data-tab="browse" aria-selected="false">Browse</button>
  </div>
  <button type="button" class="btn primary" id="export">Download duels.json</button>
</header>

<main id="duels">
  <div>
    <div class="progress"><span id="count"></span><span id="position"></span></div>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div id="duel"></div>
  <p class="hint">Which candidate sounds closer to the seed? Models are hidden. Votes are kept in this browser; export them when you're done.
  Keys: <kbd>P</kbd> play seed, A, B in turn · <kbd>Space</kbd> seed · <kbd>Q</kbd> A · <kbd>W</kbd> B · <kbd>1</kbd> A closer · <kbd>2</kbd> B closer · <kbd>=</kbd> equally close · <kbd>S</kbd> skip · <kbd>Backspace</kbd> undo · <kbd>Esc</kbd> stop.</p>
</main>

<main id="results" hidden></main>

<main id="browse" hidden>
  <div class="browse">
    <div class="seedlist"><input id="filter" type="search" placeholder="Filter seeds" aria-label="Filter seeds"><div id="seeds"></div></div>
    <div id="neighbours"></div>
  </div>
</main>

<audio id="player" preload="none"></audio>
<script>
const DATA = /*__REPORT_DATA__*/null;
const KEY = "audio-lab-duels:" + DATA.run_id;
const SNIPPET = 8; // seconds per clip when playing seed, A and B in turn
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = (x) => x == null ? "–" : (100 * x).toFixed(0) + "%";
const num = (x, d = 2) => x == null ? "–" : x.toFixed(d);

let state = { votes: {}, history: [], pos: 0 };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

$("meta").textContent = `run ${DATA.run_id} · ${DATA.seeds.length} seeds · ${DATA.duels.length} duels`;

// One shared player: clips start partway in; P plays seed, A and B for SNIPPET seconds each.
const player = $("player");
let queue = [], playingId = null, stopAt = null;
function playClip(track, id, seconds) {
  if (!track || !track.audio) return;
  stopAt = null;
  player.src = track.audio;
  playingId = id;
  const start = () => {
    player.currentTime = Math.min(track.start || 0, Math.max(0, (player.duration || 0) - 5));
    if (seconds) stopAt = player.currentTime + seconds;
    player.play().catch(() => {});
  };
  player.addEventListener("loadedmetadata", start, { once: true });
  player.load();
  markPlaying();
}
function stop() { queue = []; player.pause(); playingId = null; stopAt = null; markPlaying(); }
function playSequence(items) { queue = items.slice(1); playClip(items[0][0], items[0][1], SNIPPET); }
player.addEventListener("timeupdate", () => {
  if (stopAt != null && player.currentTime >= stopAt) {
    player.pause();
    if (queue.length) { const [t, id] = queue.shift(); playClip(t, id, SNIPPET); } else { playingId = null; markPlaying(); }
  }
});
player.addEventListener("ended", () => { if (!queue.length) { playingId = null; markPlaying(); } });
function toggle(track, id) { if (playingId === id && !player.paused) stop(); else { queue = []; playClip(track, id); } }
function markPlaying() { document.querySelectorAll("[data-clip]").forEach((el) => el.classList.toggle("playing", el.dataset.clip === playingId)); }

// Duels
const judged = () => Object.keys(state.votes).length;
function nextOpen(from) {
  for (let i = from; i < DATA.duels.length; i++) if (!(i in state.votes)) return i;
  for (let i = 0; i < from; i++) if (!(i in state.votes)) return i;
  return -1;
}
function trackHtml(t) { return `<div class="track">${esc(t.title)}<small>${esc(t.artist)}</small></div>`; }
function renderDuel() {
  const n = judged();
  $("count").textContent = `${n} judged of ${DATA.duels.length}`;
  $("bar").style.width = `${Math.min(100, 100 * n / Math.max(40, 1))}%`;
  $("position").textContent = n >= 40 ? "40 reached: enough for the gate, more makes it surer" : `${40 - n} more to reach the gate's 40`;
  const i = nextOpen(state.pos);
  if (i < 0) { $("duel").innerHTML = `<div class="card done-msg">Every duel is judged. Download duels.json.</div>`; return; }
  state.pos = i;
  const d = DATA.duels[i], s = DATA.seeds[d.seed];
  $("duel").innerHTML = `
    <div class="card" data-clip="seed"><div class="label"><span>Seed</span><span>duel ${i + 1} · rank ${d.rank}</span></div>${trackHtml(s)}
      <button type="button" class="btn play" data-play="seed"><kbd>Space</kbd> Play seed</button></div>
    <div class="pair">
      <div class="card" data-clip="a"><div class="label"><span>Candidate A</span></div>${trackHtml(d.left)}
        <button type="button" class="btn play" data-play="a"><kbd>Q</kbd> Play A</button></div>
      <div class="card" data-clip="b"><div class="label"><span>Candidate B</span></div>${trackHtml(d.right)}
        <button type="button" class="btn play" data-play="b"><kbd>W</kbd> Play B</button></div>
    </div>
    <div class="choices">
      <button type="button" class="btn" data-vote="l"><kbd>1</kbd> A is closer</button>
      <button type="button" class="btn tie" data-vote="tie"><kbd>=</kbd> Equally close</button>
      <button type="button" class="btn" data-vote="r"><kbd>2</kbd> B is closer</button>
    </div>
    <div class="minor">
      <button type="button" class="btn" data-act="all"><kbd>P</kbd> Play seed, A, B</button>
      <button type="button" class="btn" data-act="skip"><kbd>S</kbd> Skip</button>
      <button type="button" class="btn" data-act="undo" ${state.history.length ? "" : "disabled"}><kbd>⌫</kbd> Undo</button>
    </div>`;
  markPlaying();
}
function current() { const d = DATA.duels[state.pos]; return d && { d, s: DATA.seeds[d.seed] }; }
function play(which) {
  const c = current(); if (!c) return;
  const t = { seed: c.s, a: c.d.left, b: c.d.right }[which];
  toggle(t, which);
}
function vote(choice) {
  if (nextOpen(state.pos) < 0) return;
  state.votes[state.pos] = choice; state.history.push(state.pos);
  state.pos = state.pos + 1; save(); stop(); renderDuel();
}
function skip() { state.pos = (state.pos + 1) % DATA.duels.length; save(); stop(); renderDuel(); }
function undo() {
  const i = state.history.pop(); if (i == null) return;
  delete state.votes[i]; state.pos = i; save(); stop(); renderDuel();
}
$("duel").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.play) play(b.dataset.play);
  if (b.dataset.vote) vote(b.dataset.vote);
  if (b.dataset.act === "skip") skip();
  if (b.dataset.act === "undo") undo();
  if (b.dataset.act === "all") { const c = current(); if (c) playSequence([[c.s, "seed"], [c.d.left, "a"], [c.d.right, "b"]]); }
});

// Results: live duel standings and the automatic metrics.
function standings() {
  const m = DATA.models.map(() => ({ w: 0, l: 0, t: 0 }));
  for (const [i, v] of Object.entries(state.votes)) {
    const d = DATA.duels[i]; if (!d) continue;
    if (v === "tie") { m[d.l].t++; m[d.r].t++; }
    else { const win = v === "l" ? d.l : d.r, lose = v === "l" ? d.r : d.l; m[win].w++; m[lose].l++; }
  }
  return m;
}
function renderResults() {
  const st = standings(), mx = DATA.metrics;
  const rows = DATA.models.map((name, i) => {
    const s = st[i], n = s.w + s.l + s.t, r = mx.models[name] || {};
    return { name, n, s, rate: n ? (s.w + s.t / 2) / n : null, r };
  }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  const pairs = Object.entries(mx.overlap).map(([k, v]) => `<tr><td>${esc(k.replace("|", " · "))}</td><td class="num">${pct(v)}</td></tr>`).join("");
  $("results").innerHTML = `
    <div class="card"><div class="label"><span>Duel standings (${judged()} judged)</span></div>
      <div class="table-wrap"><table><thead><tr><th>Model</th><th class="num">Win rate</th><th class="num">Won</th><th class="num">Lost</th><th class="num">Tied</th></tr></thead>
      <tbody>${rows.map((x) => `<tr><td>${esc(x.name)}</td><td class="num"><b>${pct(x.rate)}</b></td><td class="num">${x.s.w}</td><td class="num">${x.s.l}</td><td class="num">${x.s.t}</td></tr>`).join("")}</tbody></table></div>
      <p class="hint">Win rate counts a tie as half a win. Looking here mid-way can bias later answers; it's best checked at the end.</p></div>
    <div class="card"><div class="label"><span>Automatic metrics (no judging needed)</span></div>
      <div class="table-wrap"><table><thead><tr><th>Model</th><th class="num">Preview→full @1</th><th class="num">@10</th><th class="num">Same artist in top 10</th><th class="num">Separation</th></tr></thead>
      <tbody>${DATA.models.map((name) => { const r = mx.models[name] || {}; return `<tr><td>${esc(name)}</td><td class="num">${num(r.recall_at_1)}</td><td class="num">${num(r.recall_at_10)}</td><td class="num">${pct(r.same_artist_rate)}</td><td class="num">${num(r.separation, 3)}</td></tr>`; }).join("")}</tbody></table></div>
      <p class="hint"><b>Preview→full:</b> how often a 30 s preview finds its own song. <b>Same artist:</b> share of the artist's other seeds in a song's top 10. <b>Separation:</b> how far the best match stands out from a typical song; higher means the model tells your tracks apart more sharply.</p></div>
    <div class="card"><div class="label"><span>Neighbours in common</span></div>
      <div class="table-wrap"><table><thead><tr><th>Models</th><th class="num">Top-10 overlap</th></tr></thead><tbody>${pairs}</tbody></table></div></div>`;
}

// Browse
let browseSeed = 0, filter = "";
function renderBrowse() {
  $("seeds").innerHTML = DATA.seeds.map((s, i) => [s, i])
    .filter(([s]) => !filter || (s.artist + " " + s.title).toLowerCase().includes(filter))
    .map(([s, i]) => `<button type="button" data-i="${i}" aria-current="${i === browseSeed}">${esc(s.artist)} – ${esc(s.title)}</button>`).join("");
  const s = DATA.seeds[browseSeed];
  $("neighbours").innerHTML = `<div class="card" data-clip="b-seed"><div class="label"><span>Seed</span></div>${trackHtml(s)}
      <button type="button" class="btn play" data-track="seed">Play seed</button></div>
    <div class="cols">${DATA.models.map((m) => `<div class="card"><div class="label"><span>${esc(m)}</span></div><ol>${(s.neighbours[m] || []).map((n, j) =>
      `<li data-clip="b-${esc(m)}-${j}"><button type="button" data-track="${esc(m)}|${j}">${esc(n.artist)} – ${esc(n.title)}</button> <span class="sim">${n.score.toFixed(3)}</span></li>`).join("")}</ol></div>`).join("")}</div>`;
  markPlaying();
}
$("seeds").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { browseSeed = +b.dataset.i; renderBrowse(); } });
$("filter").addEventListener("input", (e) => { filter = e.target.value.toLowerCase(); renderBrowse(); });
$("neighbours").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-track]"); if (!b) return;
  const s = DATA.seeds[browseSeed];
  if (b.dataset.track === "seed") return toggle(s, "b-seed");
  const [m, j] = b.dataset.track.split("|");
  toggle(s.neighbours[m][+j], `b-${m}-${j}`);
});

// Tabs, keys, export
let tab = "duels";
function show(name) {
  tab = name; stop();
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  for (const id of ["duels", "results", "browse"]) $(id).hidden = id !== name;
  if (name === "duels") renderDuel(); else if (name === "results") renderResults(); else renderBrowse();
}
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") return stop();
  if (tab !== "duels") return;
  const k = e.key.toLowerCase();
  const actions = {
    " ": () => play("seed"), q: () => play("a"), w: () => play("b"),
    p: () => { const c = current(); if (c) playSequence([[c.s, "seed"], [c.d.left, "a"], [c.d.right, "b"]]); },
    "1": () => vote("l"), "2": () => vote("r"), "=": () => vote("tie"), "0": () => vote("tie"),
    s: skip, backspace: undo,
  };
  if (actions[k]) { e.preventDefault(); actions[k](); }
});
$("export").addEventListener("click", () => {
  const votes = Object.entries(state.votes).map(([i, v]) => {
    const d = DATA.duels[i], a = DATA.models[d.l], b = DATA.models[d.r];
    return { seed: DATA.seeds[d.seed].key, a, b, winner: v === "tie" ? "tie" : v === "l" ? a : b };
  });
  const out = { run_id: DATA.run_id, exported_at: new Date().toISOString(), votes };
  const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = "duels.json"; a.click(); URL.revokeObjectURL(url);
});
show("duels");
</script>
</body>
</html>
