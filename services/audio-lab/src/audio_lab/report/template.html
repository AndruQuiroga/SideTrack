<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Lab Report</title>
<!-- Generated by `audio-lab report`. Self-contained: no network requests. Audio plays from local files. -->
<style>
:root {
  --bg: #f4f5f7; --surface: #fff; --surface-2: #eceef2; --fg: #14171f; --muted: #5d6676;
  --line: #d3d8e0; --accent: #3557e0; --good: #1d8a57; --bad: #c8382b; --unsure: #a87905;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface-2: #212734; --fg: #e5e9f1; --muted: #98a1b2;
    --line: #2f3747; --accent: #8199ff; --good: #3cc486; --bad: #ff6f62; --unsure: #e8b23a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface); display: grid; gap: 10px; }
h1 { margin: 0; font-size: 1.3rem; }
.meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; background: var(--bg); }
.stat b { font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 120px); }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav { max-height: 30vh; } }
nav { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
nav input { width: calc(100% - 16px); margin: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
nav button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; padding: 8px 12px; cursor: pointer; font: inherit; }
nav button[aria-current="true"] { background: var(--surface-2); font-weight: 600; }
nav .done { color: var(--muted); font-size: .75rem; white-space: nowrap; }
main { padding: 16px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.seed-head { display: grid; gap: 6px; }
.seed-head h2 { margin: 0; font-size: 1.15rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col h3 { margin: 0; font-size: .95rem; display: flex; justify-content: space-between; gap: 8px; }
.col h3 small { color: var(--muted); font-weight: 400; }
ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
li { min-width: 0; }
.nb { display: flex; justify-content: space-between; gap: 6px; font-size: .85rem; }
.nb span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb .sim { color: var(--muted); font-variant-numeric: tabular-nums; }
audio { width: 100%; height: 28px; }
.verdict { display: flex; gap: 6px; }
.verdict button { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 6px; cursor: pointer; font: inherit; }
.verdict button[aria-pressed="true"][data-v="good"] { background: var(--good); border-color: var(--good); color: #fff; }
.verdict button[aria-pressed="true"][data-v="bad"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.verdict button[aria-pressed="true"][data-v="unsure"] { background: var(--unsure); border-color: var(--unsure); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; font: inherit; }
.actions button.secondary { background: none; color: var(--accent); }
.hint { color: var(--muted); font-size: .8rem; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Audio lab report</h1>
  <div class="meta" id="meta"></div>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <button type="button" id="export">Download verdicts.json</button>
    <span class="hint">Verdicts are kept in this browser. Keys: ← → change seed.</span>
  </div>
</header>
<div class="layout">
  <nav aria-label="Seeds"><input id="filter" type="search" placeholder="Filter seeds" aria-label="Filter seeds"><div id="seeds"></div></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__REPORT_DATA__*/null;
const KEY = "audio-lab-verdicts:" + DATA.run_id;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let verdicts = {};
try { verdicts = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { verdicts = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(verdicts)); } catch (e) {} };
let current = 0;
let filter = "";

$("meta").innerHTML = [
  `run <b>${esc(DATA.run_id)}</b>`, `commit ${esc(DATA.git_commit)}`,
  `${DATA.seeds.length} seeds`, `models: ${DATA.models.map(esc).join(", ")}`,
].map((m) => `<span>${m}</span>`).join("");

function renderStats() {
  $("stats").innerHTML = DATA.models.map((m) => {
    const r = DATA.retrieval[m] || {};
    const judged = Object.entries(verdicts).filter(([k, v]) => k.endsWith("\u0000" + m) && v !== "unsure");
    const good = judged.filter(([, v]) => v === "good").length;
    const agree = judged.length ? (100 * good / judged.length).toFixed(0) + "%" : "–";
    const rec = r.seeds ? `recall@1 <b>${r.recall_at_1.toFixed(2)}</b> · @10 <b>${r.recall_at_10.toFixed(2)}</b> (${r.seeds})` : "no previews";
    return `<div class="stat"><b>${esc(m)}</b> · ${rec} · agreement <b>${agree}</b> of ${judged.length}</div>`;
  }).join("");
}

function visible() {
  return DATA.seeds.map((s, i) => [s, i]).filter(([s]) => !filter || (s.artist + " " + s.title).toLowerCase().includes(filter));
}

function renderNav() {
  $("seeds").innerHTML = visible().map(([s, i]) => {
    const done = DATA.models.filter((m) => verdicts[s.key + "\u0000" + m]).length;
    return `<button type="button" data-i="${i}" aria-current="${i === current}"><span>${esc(s.artist)} – ${esc(s.title)}</span><span class="done">${done}/${DATA.models.length}</span></button>`;
  }).join("");
}

function player(src) {
  return src ? `<audio controls preload="none" src="${esc(src)}"></audio>` : "";
}

function renderMain() {
  const s = DATA.seeds[current];
  if (!s) { $("main").innerHTML = "<p>No seeds.</p>"; return; }
  $("main").innerHTML = `<div class="seed-head"><h2>${esc(s.artist)} – ${esc(s.title)}</h2>${player(s.audio)}</div>
    <div class="cols">${DATA.models.map((m) => {
      const list = (s.neighbours[m] || []);
      const v = verdicts[s.key + "\u0000" + m];
      return `<section class="col"><h3>${esc(m)}<small>${list.length ? "top " + list.length : "not embedded"}</small></h3>
        <ol>${list.map((n) => `<li><div class="nb"><span title="${esc(n.artist)} – ${esc(n.title)}">${esc(n.artist)} – ${esc(n.title)}</span><span class="sim">${n.score.toFixed(3)}</span></div>${player(n.audio)}</li>`).join("")}</ol>
        ${list.length ? `<div class="verdict" role="group" aria-label="${esc(m)} verdict">${["good", "bad", "unsure"].map((x) => `<button type="button" data-m="${esc(m)}" data-v="${x}" aria-pressed="${v === x}">${x}</button>`).join("")}</div>` : ""}
      </section>`;
    }).join("")}</div>`;
}

function render() { renderStats(); renderNav(); renderMain(); }

$("seeds").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { current = +b.dataset.i; render(); } });
$("main").addEventListener("click", (e) => {
  const b = e.target.closest(".verdict button"); if (!b) return;
  const key = DATA.seeds[current].key + "\u0000" + b.dataset.m;
  if (verdicts[key] === b.dataset.v) delete verdicts[key]; else verdicts[key] = b.dataset.v;
  save(); render();
});
$("filter").addEventListener("input", (e) => { filter = e.target.value.toLowerCase(); renderNav(); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { current = Math.min(DATA.seeds.length - 1, current + 1); render(); }
  if (e.key === "ArrowLeft") { current = Math.max(0, current - 1); render(); }
});
$("export").addEventListener("click", () => {
  const out = { run_id: DATA.run_id, exported_at: new Date().toISOString(), verdicts: Object.entries(verdicts).map(([k, v]) => {
    const [seed, model] = k.split("\u0000"); return { seed, model, verdict: v };
  }) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = "verdicts.json"; a.click(); URL.revokeObjectURL(url);
});
render();
</script>
</body>
</html>
