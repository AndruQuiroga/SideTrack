<style>
  .explorer { display: grid; grid-template-columns: minmax(14rem, 22rem) 1fr; gap: 1rem; align-items: start; }
  @media (max-width: 48rem) { .explorer { grid-template-columns: 1fr; } }
  #results { list-style: none; margin: 0.5rem 0 0; padding: 0; max-height: 28rem; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  #results li button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--panel); }
  .bar-row { display: grid; grid-template-columns: 8rem 1fr 4rem; gap: 0.5rem; align-items: center; font-size: 0.9rem; }
  .bar-row svg { width: 100%; height: 14px; display: block; }
  .neighbour { border-top: 1px solid var(--line); padding: 0.4rem 0; }
  .neighbour button { text-align: left; }
</style>
<div class="explorer">
  <div class="card">
    <label for="search" class="muted">Search artist or title</label>
    <input type="search" id="search" autocomplete="off">
    <p class="muted" id="count"></p>
    <ul id="results"></ul>
  </div>
  <div class="card" id="track"><span class="muted">Pick a track.</span></div>
</div>
<p class="muted" id="footer"></p>

<script>
(function () {
  const demo = labData().demo;
  const tracks = demo.tracks;
  const search = document.getElementById("search");
  const results = document.getElementById("results");
  const panel = document.getElementById("track");
  const name = (t) => t.artist + " - " + t.title;
  const limit = Math.max(1, ...tracks.flatMap((t) => t.axes.map(Math.abs)));

  function player(track) {
    if (!track.audio) return el("div", { class: "muted", text: "audio unavailable" });
    const audio = el("audio", { controls: "", preload: "none" });
    audio.src = track.audio;
    return audio;
  }
  function bars(track) {
    const box = el("div");
    demo.axes.forEach((axis, index) => {
      const value = track.axes[index];
      const half = (Math.abs(value) / limit) * 50;
      const svg = svgEl("svg", { viewBox: "0 0 100 14", role: "img", "aria-label": axis.name + " " + value });
      svg.append(svgEl("rect", { x: 0, y: 0, width: 100, height: 14, fill: "none", stroke: "var(--line)" }));
      svg.append(svgEl("rect", { x: value >= 0 ? 50 : 50 - half, y: 2, width: half, height: 10, fill: "var(--a" + ((index % 6) + 1) + ")" }));
      svg.append(svgEl("line", { x1: 50, x2: 50, y1: 0, y2: 14, stroke: "var(--fg)" }));
      box.append(el("div", { class: "bar-row" }, [el("span", { text: axis.name }), svg, el("span", { text: (value >= 0 ? "+" : "") + value })]));
    });
    return box;
  }
  function show(index) {
    const track = tracks[index];
    panel.replaceChildren(el("h2", { text: name(track) }), player(track));
    panel.append(el("h3", { text: "Where it sits on your axes" }), el("p", { class: "muted", text: "In spreads of your analysed library; zero is its average." }), bars(track));
    panel.append(el("h3", { text: "Nearest tracks" }));
    track.neighbours.forEach((n) => {
      const other = tracks[n.track];
      const open = el("button", { type: "button", text: name(other) });
      open.addEventListener("click", () => show(n.track));
      const row = el("div", { class: "neighbour" }, [open, el("span", { class: "muted", text: "  closeness " + n.cosine }), player(other)]);
      panel.append(row);
    });
    if (!track.neighbours.length) panel.append(el("p", { class: "muted", text: "No other analysed track to compare with." }));
  }
  function list() {
    const query = search.value.trim().toLowerCase();
    results.replaceChildren();
    const found = [];
    tracks.forEach((track, index) => { if (!query || name(track).toLowerCase().indexOf(query) >= 0) found.push(index); });
    found.slice(0, 200).forEach((index) => {
      const button = el("button", { type: "button", text: name(tracks[index]) + (tracks[index].audio ? "" : " (audio unavailable)") });
      button.addEventListener("click", () => show(index));
      results.append(el("li", {}, [button]));
    });
    document.getElementById("count").textContent = found.length + " of " + tracks.length + " tracks" + (found.length > 200 ? ", first 200 shown" : "");
  }
  search.addEventListener("input", list);
  list();
  document.getElementById("footer").textContent = "Closeness is cosine similarity in the " + demo.model + " embedding. " + (demo.left_out ? demo.left_out + " analysed tracks have no embedding in the run and are left out." : "");
})();
</script>
