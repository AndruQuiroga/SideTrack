[project]
name = "sidetrack-extraction"
version = "0.1.0"
description = "Audio feature extraction service for Sidetrack (GPU-heavy)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
    "openl3==0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extraction"]

[tool.ruff]
line-length = 100
target-version = "py311"
