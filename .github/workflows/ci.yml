name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # Same image as deploy/stack.yml; tests migrate it with Alembic.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sidetrack
          POSTGRES_PASSWORD: sidetrack
          POSTGRES_DB: sidetrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidetrack -d sidetrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDETRACK_TEST_DATABASE_URL: postgresql+psycopg://sidetrack:sidetrack@localhost:5432/sidetrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --frozen --python 3.11 --extra api --extra worker --extra dev
      - name: Ruff
        run: |
          uv run --frozen ruff check sidetrack services/api services/worker scripts tests
          uv run --frozen ruff format --check sidetrack services/api scripts tests
      - name: Module boundaries
        run: uv run --frozen lint-imports
      - name: Mypy (known errors, tracked in docs/STATUS.md)
        # 39 existing errors as of 2026-10-25; see docs/STATUS.md.
        continue-on-error: true
        run: uv run --frozen mypy sidetrack
      - name: Tests
        run: uv run --frozen pytest -m "not slow and not gpu"
      - name: Deploy docs cover the stack
        run: uv run --frozen python scripts/check_stack_docs.py
      - name: Status page is current
        run: uv run --frozen python scripts/gen_status.py --check

  audio-lab:
    # Core layer only: no PyTorch, no GPU, no model downloads (ADR 0004).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audio-lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --frozen --python 3.11 --extra dev
      - name: Ruff
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: Tests
        run: uv run --frozen pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r run lint
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm -r run build
      - name: Test
        run: pnpm -r run test

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate OpenSpec changes and specs
        env:
          OPENSPEC_TELEMETRY: '0'
        run: pnpm exec openspec validate --all --strict

  images:
    needs: [python, node, specs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: services/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: bot
            dockerfile: apps/bot/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andruquiroga/sidetrack-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }} ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
