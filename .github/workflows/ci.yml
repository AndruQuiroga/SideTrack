name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --python 3.11 --extra api --extra dev
      - name: Lint (ruff + mypy)
        run: |
          uv run --frozen ruff check apps/api apps/worker
          uv run --frozen mypy apps/api apps/worker
      - name: Unit tests
        run: uv run --frozen pytest -m unit

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint workspace (TypeScript)
        run: pnpm -r run lint
      - name: Unit suites (TypeScript)
        run: pnpm -r run test

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, bot, web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t sidetrack/${{ matrix.app }}:ci .
