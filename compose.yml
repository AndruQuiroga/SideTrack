# Local development. Production on Stache-Rack uses deploy/stack.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    env_file: ${SIDETRACK_ENV_FILE:-.env}
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: sidetrack/api:dev
    env_file: ${SIDETRACK_ENV_FILE:-.env}
    environment:
      SIDETRACK_ENV: ${SIDETRACK_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: sidetrack/api:dev
    command: ['python', '-m', 'sidetrack.worker']
    stop_grace_period: 40s
    env_file: ${SIDETRACK_ENV_FILE:-.env}
    environment:
      SIDETRACK_ENV: ${SIDETRACK_ENV:-development}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: ${SIDETRACK_ENV_FILE:-.env}
    environment:
      SIDETRACK_API_BASE_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: ${SIDETRACK_ENV_FILE:-.env}
    environment:
      SIDETRACK_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
