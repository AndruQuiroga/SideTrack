repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3
        files: \.(tsx?|jsx?|json|md|css|mjs|cjs)$

  - repo: local
    hooks:
      - id: eslint-ui
        name: "eslint (ui)"
        entry: npx eslint --max-warnings=0
        language: node
        types_or: [ts, tsx]
        files: ^apps/web/.*\.(tsx?)$
        additional_dependencies:
          - "eslint@9"
          - "typescript-eslint@8"
          - "@eslint/js@9"
          - "eslint-config-prettier@10"
          - "typescript@^5"
