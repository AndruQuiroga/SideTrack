        status: partial
        notes: "The database rejects voting for the same nomination twice (uq_vote_nomination_user). No self-vote or voting-phase checks (routes/votes.py)"
        evidence:
          - services/api/tests/test_votes.py
      - capability: Ratings and summary
        status: works
        notes: "Submission stores every field including metadata; reads, one rating per member per week, summaries and member-only access are tested (fix-user-deletion-and-metadata-alias)"
        evidence:
          - services/api/tests/test_ratings.py
          - services/api/tests/test_club_access.py
      - capability: Reminders and phase transitions
        status: partial
        notes: "Deadlines and leased delivery persist in Postgres; restart and send/ack behavior tested. Notices do not enforce phases; real Discord delivery not verified."
        evidence:
