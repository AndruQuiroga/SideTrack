# Source for docs/STATUS.md. Edit this file, then run: python scripts/gen_status.py
# Statuses: works | partial | broken | stub | absent.
# "works" needs at least one evidence path (a test, preferably) that exists in the repo.

reviewed: 2026-10-26

groups:
