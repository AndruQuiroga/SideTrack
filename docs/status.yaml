      - capability: ListenBrainz import
        status: absent
      - capability: MusicBrainz resolution
        status: partial
        notes: "Per-scrobble web API calls inside imports; attempts share a global Postgres pacing lock, including HTTP retries"

  - name: Analysis
    items:
      - capability: Audio acquisition
        status: works
        notes: "Opt-in `python -m sidetrack.audio` (ADR 0007): YouTube Music full tracks and Deezer previews, content-addressed storage, AcoustID verification, manifest, verify and prune. Real 5-seed run on 2026-10-26: 10 assets stored, all 5 full tracks AcoustID-confirmed (0.96-1.00); previews stay unverified as expected"
        evidence:
          - tests/test_audio_assets.py
          - tests/test_audio_cli.py
          - docs/AUDIO.md
      - capability: Audio feature extraction
        status: partial
        notes: "services/audio-lab benchmark CLI (ADR 0004) embeds acquired audio into versioned Parquet runs with a neighbour report and verdict scoring; benchmark only, not integrated into Sidetrack. No model has passed the gate yet (docs/AUDIO-BENCHMARK.md)"
        evidence:
          - services/audio-lab/tests/test_runs.py
          - services/audio-lab/tests/test_neighbours.py
          - services/audio-lab/tests/test_report_and_score.py
      - capability: Embedding models (any)
        status: partial
        notes: "MuQ, MuQ-MuLan, MERT-v1-95M and CLAP run on the owner's RTX 5070 (gpu-marked tests and a 10-asset smoke run, 2026-10-26). Quality is unjudged; the GTX 1070 Ti is unmeasured"
        evidence:
