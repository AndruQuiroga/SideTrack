          - services/api/tests/test_jobs.py
      - capability: Listen storage
        status: works
        notes: "listen_events.source matches the database enum, and the listen-event routes return stored rows with metadata. Before 2026-10-25 every listen insert failed on Postgres; before 2026-10-26 every listen-event response returned 500"
