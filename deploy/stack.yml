# Sidetrack on Stache-Rack (Docker Swarm, deployed as a Portainer stack).
# Setup, secrets and rollback: deploy/README.md. Decision record: docs/decisions/0006.
version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  condition: any
  delay: 5s

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sidetrack
      POSTGRES_USER: sidetrack
      POSTGRES_PASSWORD_FILE: /run/secrets/sidetrack_postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - sidetrack_postgres_password
    volumes:
      - type: bind
        source: /srv/sidetrack/postgres
        target: /var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidetrack -d sidetrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    stop_grace_period: 1m
    deploy:
      replicas: 1
      placement:
        constraints:
          # Node-local data: label exactly one node, and move data before moving the label.
          - node.labels.sidetrack.db == true
      restart_policy: *restart

  api:
    image: ghcr.io/andruquiroga/sidetrack-api:${SIDETRACK_TAG:?set SIDETRACK_TAG to an image tag}
    environment:
      SIDETRACK_ENV: production
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SIDETRACK_MUSICBRAINZ_APP_NAME: ${SIDETRACK_MUSICBRAINZ_APP_NAME:-Sidetrack/0.1}
    secrets: &api_secrets
      - source: sidetrack_database_url
        target: database_url
      - source: sidetrack_web_api_token
        target: sidetrack_web_api_token
      - source: sidetrack_bot_api_token
        target: sidetrack_bot_api_token
      - source: sidetrack_link_secret
        target: sidetrack_link_secret
      - source: sidetrack_lastfm_api_secret
        target: lastfm_api_secret
      - source: sidetrack_spotify_client_secret
        target: spotify_client_secret
    networks:
      - backend
      - traefik-public
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      # One replica: the entrypoint runs Alembic migrations on start.
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == amd64
      restart_policy: *restart
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.sidetrack-api.rule=Host(`api.sidetrack.stache.lan`) || Host(`api.sidetrack.network`)
        - traefik.http.routers.sidetrack-api.entrypoints=web
        - traefik.http.services.sidetrack-api.loadbalancer.server.port=8000

  worker:
    image: ghcr.io/andruquiroga/sidetrack-api:${SIDETRACK_TAG:?set SIDETRACK_TAG to an image tag}
    command: ["python", "-m", "sidetrack.worker"]
    stop_grace_period: 40s
    environment:
      SIDETRACK_ENV: production
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      SIDETRACK_MUSICBRAINZ_APP_NAME: ${SIDETRACK_MUSICBRAINZ_APP_NAME:-Sidetrack/0.1}
    secrets: *api_secrets
    networks:
      - backend
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == amd64
      restart_policy: *restart

  web:
    image: ghcr.io/andruquiroga/sidetrack-web:${SIDETRACK_TAG:?set SIDETRACK_TAG to an image tag}
    environment:
      SIDETRACK_API_BASE_URL: http://api:8000
      NEXTAUTH_URL: https://sidetrack.network
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      SIDETRACK_WEB_API_TOKEN_FILE: /run/secrets/sidetrack_web_api_token
      NEXTAUTH_SECRET_FILE: /run/secrets/sidetrack_nextauth_secret
      DISCORD_CLIENT_SECRET_FILE: /run/secrets/sidetrack_discord_client_secret
    secrets:
      - sidetrack_web_api_token
      - sidetrack_nextauth_secret
      - sidetrack_discord_client_secret
    networks:
      - backend
      - traefik-public
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == amd64
      restart_policy: *restart
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.sidetrack-web.rule=Host(`sidetrack.stache.lan`) || Host(`sidetrack.network`)
        - traefik.http.routers.sidetrack-web.entrypoints=web
        - traefik.http.services.sidetrack-web.loadbalancer.server.port=3000

  bot:
    image: ghcr.io/andruquiroga/sidetrack-bot:${SIDETRACK_TAG:?set SIDETRACK_TAG to an image tag}
    environment:
      SIDETRACK_API_BASE_URL: http://api:8000
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}
      SIDETRACK_NOMINATIONS_FORUM_ID: ${SIDETRACK_NOMINATIONS_FORUM_ID:-}
      SIDETRACK_ADMIN_ROLE_IDS: ${SIDETRACK_ADMIN_ROLE_IDS:-}
      DISCORD_MEMBERS_INTENT: ${DISCORD_MEMBERS_INTENT:-false}
      SIDETRACK_BOT_API_TOKEN_FILE: /run/secrets/sidetrack_bot_api_token
      DISCORD_BOT_TOKEN_FILE: /run/secrets/sidetrack_discord_bot_token
    secrets:
      - sidetrack_bot_api_token
      - sidetrack_discord_bot_token
    networks:
      - backend
    logging: *logging
    deploy:
      # Exactly one gateway connection to Discord.
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == amd64
      restart_policy: *restart

networks:
  backend:
    driver: overlay
  traefik-public:
    external: true

secrets:
  sidetrack_postgres_password:
    external: true
  sidetrack_database_url:
    external: true
  sidetrack_web_api_token:
    external: true
  sidetrack_bot_api_token:
    external: true
  sidetrack_link_secret:
    external: true
  sidetrack_lastfm_api_secret:
    external: true
  sidetrack_spotify_client_secret:
    external: true
  sidetrack_nextauth_secret:
    external: true
  sidetrack_discord_client_secret:
    external: true
  sidetrack_discord_bot_token:
    external: true
