[project]
name = "sidetrack"
version = "0.1.0"
description = "Multi-service SideTrack application"
requires-python = ">=3.11,<3.12"
# NOTE: Heavy / GPU deps (tensorflow, librosa, openl3, etc.) must NOT go here.
# They belong in standalone services under services/ with their own pyproject.toml
# and uv.lock. uv resolves ALL extras in a single lockfile — adding heavy extras
# here penalises every developer and CI run. See services/audio-lab/README.md.
dependencies = [
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "psycopg[binary]==3.2.1",
    "alembic==1.13.2",
    "SQLAlchemy==2.0.32",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]

api = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "tenacity==8.2.3",
    "passlib[bcrypt]==1.7.4",
    "google-auth==2.40.3",
    "procrastinate==3.10.0",
]

worker = [
    "procrastinate==3.10.0",
]

# Opt-in audio acquisition (ADR 0007): `python -m sidetrack.audio`. Not in any image.
audio = [
    "yt-dlp==2026.10.21",
    # Official JS challenge solver for YouTube (used with the deno runtime).
    "yt-dlp-ejs==0.8.0",
    "pyacoustid==1.3.1",
]

dev = [
    "numpy==1.26.4",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "testcontainers[postgres]==4.7.1",
    "factory-boy==3.3.0",
    "pre-commit==3.7.0",
    "docker==7.1.0",
    "freezegun==1.5.1",
    "pytest-socket==0.7.0",
    "syrupy==4.6.0",
    "respx==0.20.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "import-linter>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["sidetrack", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions/"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort import order
  "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []
exclude = [
    "migrations/.*",
]

[tool.pytest.ini_options]
# The audio lab is its own project with its own environment and CI job.
addopts = "-q -x --strict-markers --disable-warnings -m \"not contract\" --ignore=services/audio-lab"
markers = [
    "unit: fast-running tests that mock external services",
    "integration: tests that require external services",
    "contract: contract tests with external APIs",
    "slow: tests exceeding the default speed budget",
    "gpu: tests requiring GPU hardware",
    "e2e: end-to-end tests",
]

[tool.importlinter]
root_packages = ["sidetrack", "services"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "identity internals have one owner"
type = "protected"
protected_modules = ["sidetrack.identity.models", "sidetrack.identity.routes", "sidetrack.identity.link_state"]
allowed_importers = ["sidetrack.identity", "services.api.tests"]
ignore_imports = ["sidetrack.api.routes -> sidetrack.identity.routes.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "catalog internals have one owner"
type = "protected"
protected_modules = ["sidetrack.catalog.models", "sidetrack.catalog.routes", "sidetrack.catalog.metadata"]
allowed_importers = ["sidetrack.catalog", "services.api.tests"]
ignore_imports = ["sidetrack.api.routes -> sidetrack.catalog.routes.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "listening internals have one owner"
type = "protected"
protected_modules = ["sidetrack.listening.models", "sidetrack.listening.routes", "sidetrack.listening.ingest"]
allowed_importers = ["sidetrack.listening", "services.api.tests"]
ignore_imports = ["sidetrack.api.routes -> sidetrack.listening.routes.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "club internals have one owner"
type = "protected"
protected_modules = ["sidetrack.club.models", "sidetrack.club.routes", "sidetrack.club.notifications", "sidetrack.club.membership"]
allowed_importers = ["sidetrack.club", "services.api.tests"]
ignore_imports = ["sidetrack.api.routes -> sidetrack.club.routes.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "analysis internals have one owner"
type = "protected"
protected_modules = ["sidetrack.analysis.models", "sidetrack.analysis.routes", "sidetrack.analysis.taste", "sidetrack.analysis.compatibility", "sidetrack.analysis.constants"]
allowed_importers = ["sidetrack.analysis", "services.api.tests"]
ignore_imports = ["sidetrack.api.routes -> sidetrack.analysis.routes.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "audio acquisition runs only from its CLI (ADR 0007)"
type = "protected"
protected_modules = ["sidetrack.analysis.audio"]
allowed_importers = ["sidetrack.analysis.audio", "sidetrack.audio"]

[[tool.importlinter.contracts]]
name = "Domains do not depend on composition or legacy services"
type = "forbidden"
source_modules = ["sidetrack.identity", "sidetrack.catalog", "sidetrack.listening", "sidetrack.club", "sidetrack.analysis"]
forbidden_modules = ["sidetrack.api", "sidetrack.models", "services"]
allow_indirect_imports = true
