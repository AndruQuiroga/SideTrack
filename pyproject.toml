[project]
name = "sidetrack"
version = "0.1.0"
description = "Multi-service SideTrack application"
requires-python = ">=3.11,<3.12"
# NOTE: Heavy / GPU deps (tensorflow, librosa, openl3, etc.) must NOT go here.
# They belong in standalone services under services/ with their own pyproject.toml
# and uv.lock. uv resolves ALL extras in a single lockfile — adding heavy extras
# here penalises every developer and CI run. See services/extraction/README.md.
dependencies = [
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "psycopg[binary]==3.2.1",
    "alembic==1.13.2",
    "SQLAlchemy==2.0.32",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]

api = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "tenacity==8.2.3",
    "passlib[bcrypt]==1.7.4",
    "redis==5.0.7",
    "rq==1.16.2",
    "google-auth==2.40.3",
    "fastapi-limiter==0.1.6",
]

worker = [
    "redis==5.0.7",
    "rq==1.16.2",
    "apscheduler==3.10.4",
]

dev = [
    "numpy==1.26.4",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "testcontainers[postgres,redis]==4.7.1",
    "factory-boy==3.3.0",
    "pre-commit==3.7.0",
    "docker==7.1.0",
    "freezegun==1.5.1",
    "pytest-socket==0.7.0",
    "syrupy==4.6.0",
    "respx==0.20.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions/"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort import order
  "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []
exclude = [
    "migrations/.*",
]

[tool.pytest.ini_options]
addopts = "-q -x --strict-markers --disable-warnings -m \"not contract\""
markers = [
    "unit: fast-running tests that mock external services",
    "integration: tests that require external services",
    "contract: contract tests with external APIs",
    "slow: tests exceeding the default speed budget",
    "gpu: tests requiring GPU hardware",
    "e2e: end-to-end tests",
]
